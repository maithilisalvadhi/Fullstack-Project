spring.application.name=activity-hub
server.port=8080
server.servlet.context-path=/

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/activity_hub_demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:activityhub}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:activityhub}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Logging
logging.level.root=WARN
logging.level.com.campus.activityhub=DEBUG
