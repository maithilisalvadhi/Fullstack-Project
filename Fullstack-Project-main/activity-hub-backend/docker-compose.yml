services:
  mysql:
    image: mysql:8.4
    container_name: activity-hub-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: activity_hub_demo
      MYSQL_USER: activityhub
      MYSQL_PASSWORD: activityhub
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: